# Pushing a tag such as v0.2.0 builds the apps of macOS, Windows and
# Linux, then publishes the release after all packages are uploaded.
# macOS bundles use ad-hoc signing and are not notarized.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mygo build uploads to the release of mygo.json's version, whichever
      # tag started the workflow.
      - name: Require the update signing key
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "MYGO_UPDATER_PRIVATE_KEY must be configured before releasing" >&2
            exit 1
          fi
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      # mygo build puts the version's section of CHANGELOG.md in the update
      # manifests, which the update window shows; the release page gets the
      # same notes, in place of GitHub's from the pull requests.
      - name: Take the notes from the changelog
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS-arm64, os: macos-15, platform: "darwin/arm64" }
          - { name: macOS-amd64, os: macos-15-intel, platform: "darwin/amd64" }
          - { name: Windows, os: ubuntu-24.04, platform: "windows/amd64,windows/arm64" }
          - { name: Linux-amd64, os: ubuntu-24.04, platform: "linux/amd64" }
          - { name: Linux-arm64, os: ubuntu-24.04-arm, platform: "linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test pinned libmpv bundle preparation
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Download and verify the pinned libmpv bundle
        run: python scripts/prepare_mpv.py --platform "${{ matrix.platform }}"
      - name: Test native decoding, spectrum and recognition
        if: matrix.name != 'Windows'
        shell: bash
        run: |
          platform="${{ matrix.platform }}"
          case "$platform" in
            darwin/*) lib=libmpv.dylib ;;
            linux/*) lib=libmpv.so.2 ;;
          esac
          export TIAOPIN_TEST_MPV=1
          export TIAOPIN_MPV_LIBRARY="$PWD/resources/${platform/\//-}/mpv/$lib"
          go test ./internal/...
      - name: Build packages and signed updates
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -skip-build-command -platform "${{ matrix.platform }}"
      - name: Require update manifests
        shell: bash
        env:
          PLATFORMS: ${{ matrix.platform }}
        run: |
          for platform in ${PLATFORMS//,/ }; do
            target=${platform/\//-}
            test -s "build/$target/update-$target.json"
          done
      - name: Package portable Windows apps
        if: matrix.name == 'Windows'
        shell: bash
        run: |
          slug=$(jq -r .slug mygo.json)
          version=$(jq -r .version mygo.json)
          for arch in amd64 arm64; do
            dir="build/windows-$arch"
            test -f "$dir/TiaopinFM.exe"
            test -f "$dir/$slug-setup-$version-$arch.exe"
            # The installer is already built; only the portable ZIP gets this marker.
            touch "$dir/portable.flag"
            (cd "$dir" && zip -r "../$slug-portable-$version-windows-$arch.zip" . -x '*-setup-*.exe' 'data/*' '*.tar.gz' '*.delta' 'update-*.json')
            rm "$dir/portable.flag"
          done
      - name: Upload packages to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          packages=()
          while IFS= read -r -d '' package; do
            packages+=("$package")
          done < <(find build -maxdepth 2 -type f \( -name '*.dmg' -o -name '*-setup-*.exe' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*-portable-*.zip' -o -name 'update-*.json' -o -name '*.delta' \) -print0)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No distribution packages were built" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${packages[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download and verify the pinned Windows libmpv bundle
        run: python scripts/prepare_mpv.py --platform windows/amd64
      - name: Test Windows native decoding, spectrum and recognition
        shell: bash
        run: |
          export TIAOPIN_TEST_MPV=1
          export TIAOPIN_MPV_LIBRARY="$PWD/resources/windows-amd64/mpv/mpv-2.dll"
          go test ./internal/...

  publish:
    needs: [build, test-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
